spring.application.name=PhegonHotel
#MYSQL CONNECTION
server.port=4040
spring.datasource.url=jdbc:mysql://localhost:3306/phegon_hotel_db
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Run data.sql on every startup (ON DUPLICATE KEY UPDATE makes it safe)
# spring.sql.init.mode=always
# spring.jpa.defer-datasource-initialization=true

# Local file storage
app.upload.dir=uploads/room-images
app.base-url=http://localhost:4040
